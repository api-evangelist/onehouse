aid: onehouse
name: Onehouse
description: >-
  Onehouse is a fully managed universal data lakehouse platform, built by the
  original creators of Apache Hudi. It provides near real-time data ingestion
  (CDC and streaming), incremental ETL/ELT pipelines, automated table
  optimization (compaction, clustering, cleaning), and open table-format
  interoperability across Apache Hudi, Apache Iceberg, and Delta Lake via Apache
  XTable. Onehouse Cloud, the Quanton execution engine, OneFlow ingestion, Open
  Engines, and LakeView are exposed programmatically through a control-plane SQL
  Command API plus Status API, an official Python SDK, an `oh` CLI, and a
  Terraform provider, letting data teams manage lakes, databases, tables, flows,
  and clusters as code while data stays in the customer's own VPC.
